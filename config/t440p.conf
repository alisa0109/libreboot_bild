# T440p Libreboot Builder configuration
#
# Sourced as shell variables by build.sh. Keep values quoted.

MODEL="t440p"

# Real lbmk coreboot target names for this board (see README "Grounded in
# real Libreboot source" section for how these were confirmed). "full" is
# the primary 12 MiB image covering both flash chips; "recovery" is the
# newer 4 MiB CBFS-only image for re-flashing just the smaller chip.
LIBREBOOT_TARGET_FULL="t440plibremrc_12mb"
LIBREBOOT_TARGET_RECOVERY="t440plibremrc_4mcbfs_12mb"

PAYLOAD="grub2"

GRUB_BACKGROUND="assets/grub-background.png"
GRUB_TIMEOUT="5"
GRUB_DEFAULT_ENTRY=""
GRUB_KEYMAP=""

# Not an active "patch": libreboot/coreboot never contains Lenovo's
# whitelist-enforcement code in the first place, so there is nothing to
# toggle. Kept for compatibility with the original spec; controls only
# whether the report documents/verifies this fact. See README.
REMOVE_WIFI_WHITELIST="true"

# Preserve the GbE MAC address found in the user's own verified BIOS dumps
# by writing it into the freshly built ROM (via ifdtool+nvmutil, mirroring
# lbmk's own documented mechanism). If "false", the ROM keeps whatever
# generic/template MAC lbmk's checked-in GbE template ships with.
PRESERVE_ORIGINAL_MAC="true"

VERIFY_DUMPS="true"
VERIFY_OUTPUT="true"
CLEAN_BUILD="true"

# Never auto-executed regardless of this value: build.sh only ever prints
# the exact apt command for the user to run themselves.
AUTO_INSTALL_DEPENDENCIES="false"

# Git ref to check out in the cloned lbmk repository. "recommended" pins
# to the commit this tool was last verified against (see README).
LIBREBOOT_VERSION="recommended"
LIBREBOOT_RECOMMENDED_COMMIT="8d0ad21112b73c956907d75c1565d09d26980ac4"
LIBREBOOT_GIT_URL="https://codeberg.org/libreboot/lbmk.git"
